server {
    listen 80;
    server_name smartmoneyhub.tech;

    root /var/www/smartmoneyhub-ops;
    index index.html;
    server_tokens off;

    location = /api/healthz {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"status":"ok"}';
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

          items:
            $ref: "#/components/schemas/PortalCommandCenterBot"
        channels:
          type: array
          items:
            $ref: "#/components/schemas/PortalCommandCenterChannel"
        recentOperations:
          type: array
          items:
            $ref: "#/components/schemas/PortalCommandCenterOperation"
        recentErrors:
          type: array
          items:
            $ref: "#/components/schemas/PortalCommandCenterError"

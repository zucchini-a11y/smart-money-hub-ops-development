        requestId:
          type: string
          minLength: 1
          maxLength: 128
        telegramUserId:
          type: integer
          minimum: 1
        text:
          type: string
          minLength: 3
          maxLength: 3000
      required:
        - requestId
        - telegramUserId
        - text
    BotOutboxItem:
      type: object
      properties:
        replyId:
          type: string
        caseId:
          type: string
        telegramUserId:
          type: string
        text:
          type: string
        responderName:
          type: string
      required:
        - replyId
        - caseId
        - telegramUserId
        - text
        - responderName
    BotOutbox:
      type: object
      properties:
        replies:
          type: array
          items:
            $ref: "#/components/schemas/BotOutboxItem"
      required:
        - replies
    BotOutboxAckInput:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - sent
            - failed
            - uncertain
      required:
        - outcome
    BotOutboxAck:
      type: object
      properties:
        status:
          type: string
          enum:
            - sent
            - failed
            - uncertain
      required:
        - status
    EducationVideoDraftInput:
      type: object
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 120
        caption:
          type: string
          minLength: 1
          maxLength: 900
        fileName:
          type: string
          minLength: 1
          maxLength: 160
        byteSize:
          type: integer
          minimum: 1
          maximum: 50000000
        contentType:
          type: string
          enum:
            - video/mp4
        requestId:
          type: string
          minLength: 16
          maxLength: 120
      required:
        - title
        - caption
        - fileName
        - byteSize
        - contentType
        - requestId
    EducationVideoPublishInput:
      type: object
      properties:
        requestId:
          type: string
          minLength: 16
          maxLength: 120
      required:
        - requestId
    EducationVideo:
      type: object
      properties:
        videoId:
          type: string
        title:
          type: string
        caption:
          type: string
        fileName:
          type: string
        byteSize:
          type: integer
        status:
          type: string

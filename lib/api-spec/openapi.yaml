openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: whatsapp
    description: WhatsApp assistant administration
  - name: supportPortal
    description: Authenticated staff support portal
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /whatsapp/health:
    get:
      operationId: getWhatsAppHealth
      tags:
        - whatsapp
      summary: WhatsApp assistant health
      responses:
        "200":
          description: Service health without secret values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppHealth"
  /whatsapp/auth/me:
    get:
      operationId: getWhatsAppAuthStatus
      tags:
        - whatsapp
      summary: Current admin session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /whatsapp/auth/login:
    post:
      operationId: loginWhatsAppAdmin
      tags:
        - whatsapp
      summary: Sign in to the private admin dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLogin"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
        "401":
          description: Invalid credentials
  /whatsapp/auth/logout:
    post:
      operationId: logoutWhatsAppAdmin
      tags:
        - whatsapp
      summary: End the admin session
      responses:
        "204":
          description: Session ended
  /whatsapp/dashboard:
    get:
      operationId: getWhatsAppDashboard
      tags:
        - whatsapp
      summary: Dashboard totals and recent activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppDashboard"
  /whatsapp/activity:
    get:
      operationId: getWhatsAppActivity
      tags:
        - whatsapp
      summary: Recent sanitized bot activity
      responses:
        "200":
          description: Activity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsAppActivity"
  /whatsapp/conversations:
    get:
      operationId: listWhatsAppConversations
      tags:
        - whatsapp
      summary: List WhatsApp conversations and enquiries
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: enquiriesOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WhatsAppConversation"
  /whatsapp/conversations/{conversationId}:
    get:
      operationId: getWhatsAppConversation
      tags:
        - whatsapp
      summary: View a conversation and its messages
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppConversationDetail"
        "404":
          description: Conversation not found
  /whatsapp/conversations/{conversationId}/reply:
    post:
      operationId: replyToWhatsAppConversation
      tags:
        - whatsapp
      summary: Send an admin reply to a test recipient
      parameters:
        - name: conversationId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminReply"
      responses:
        "200":
          description: Reply sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppMessage"
        "403":
          description: Outside the active test or customer-service window
  /whatsapp/education-modules:
    get:
      operationId: listWhatsAppEducationModules
      tags:
        - whatsapp
      summary: List editable lesson topics
      responses:
        "200":
          description: Education modules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EducationModule"
  /whatsapp/education-modules/{slug}:
    put:
      operationId: updateWhatsAppEducationModule
      tags:
        - whatsapp
      summary: Update approved educational content
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationModuleUpdate"
      responses:
        "200":
          description: Updated education module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationModule"
        "404":
          description: Module not found
  /whatsapp/settings:
    get:
      operationId: getWhatsAppSettings
      tags:
        - whatsapp
      summary: Safe connection and assistant settings
      responses:
        "200":
          description: Settings without credential values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSettings"
    patch:
      operationId: updateWhatsAppSettings
      tags:
        - whatsapp
      summary: Pause or resume replies and update the community link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppSettingsUpdate"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppSettings"
  /support/auth/session:
    get:
      operationId: getSupportSession
      tags:
        - support
      summary: Check the support staff session
      responses:
        "200":
          description: Session state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
  /support/auth/bootstrap:
    post:
      operationId: bootstrapSupportOwner
      tags:
        - support
      summary: Create the first development-only support owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportBootstrap"
      responses:
        "201":
          description: Owner account created and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "409":
          description: Setup is already complete
  /support/auth/login:
    post:
      operationId: loginSupportStaff
      tags:
        - support
      summary: Sign in to the support portal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportLogin"
      responses:
        "200":
          description: Signed-in staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "401":
          description: Invalid credentials
  /support/auth/logout:
    post:
      operationId: logoutSupportStaff
      tags:
        - support
      summary: Sign out of the support portal
      responses:
        "204":
          description: Session ended
  /support/cases:
    get:
      operationId: listSupportCases
      tags:
        - support
      summary: List cases visible to the signed-in staff member
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - open
              - closed
              - all
      responses:
        "200":
          description: Visible support cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseList"
  /support/cases/{caseId}:
    get:
      operationId: getSupportCase
      tags:
        - support
      summary: Get a case and its conversation history
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Case detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseDetail"
        "404":
          description: Case not found or not visible
  /support/cases/{caseId}/replies:
    post:
      operationId: createSupportReply
      tags:
        - support
      summary: Queue a reply for the case's originating bot
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportReplyInput"
      responses:
        "202":
          description: Reply queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
  /support/cases/{caseId}/assignment:
    patch:
      operationId: assignSupportCase
      tags:
        - support
      summary: Assign or unassign a case
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportAssignmentInput"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseSummary"
  /support/cases/{caseId}/status:
    patch:
      operationId: updateSupportCaseStatus
      tags:
        - support
      summary: Update case workflow status
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportStatusInput"
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportCaseSummary"
  /support/cases/{caseId}/notes:
    post:
      operationId: addSupportCaseNote
      tags:
        - support
      summary: Add a private staff note
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportNoteInput"
      responses:
        "201":
          description: Note saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportNote"
  /support/staff:
    get:
      operationId: listSupportStaff
      tags:
        - support
      summary: List active support staff for assignment
      responses:
        "200":
          description: Staff accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportStaff"
  /support/bot/cases:
    post:
      operationId: createBotSupportCase
      tags:
        - support
      summary: Create or retrieve an idempotent case for an authenticated bot
      security:
        - botBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotCreateCaseInput"
      responses:
        "201":
          description: Case created or retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCase"
    get:
      operationId: listMemberBotCases
      tags:
        - support
      summary: List only the authenticated bot member's cases
      security:
        - botBearer: []
      parameters:
        - name: telegramUserId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Member-owned cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCaseList"
  /support/bot/case:
    get:
      operationId: getMemberBotCase
      tags:
        - support
      summary: Get only an owned case for the authenticated bot
      security:
        - botBearer: []
      parameters:
        - name: caseId
          in: query
          required: true
          schema:
            type: string
        - name: telegramUserId
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Member-owned case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotCaseDetail"
        "404":
          description: Case not found or not owned
  /support/bot/cases/{caseId}/messages:
    post:
      operationId: createMemberBotCaseMessage
      tags:
        - support
      summary: Add an idempotent member reply to an owned case
      security:
        - botBearer: []
      parameters:
        - name: caseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotMemberMessageInput"
      responses:
        "201":
          description: Member message saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportMessage"
  /support/bot/outbox/claim:
    post:
      operationId: claimBotSupportReplies
      tags:
        - support
      summary: Claim pending replies for this bot without cross-bot delivery
      security:
        - botBearer: []
      responses:
        "200":
          description: Claimed replies for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotOutbox"
  /support/bot/outbox/{replyId}/ack:
    post:
      operationId: acknowledgeBotSupportReply
      tags:
        - support
      summary: Record delivery outcome without automatic retries
      security:
        - botBearer: []
      parameters:
        - name: replyId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotOutboxAckInput"
      responses:
        "200":
          description: Delivery outcome recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotOutboxAck"
  /portal/auth/login:
    post:
      operationId: portalLogin
      tags:
        - supportPortal
      summary: Sign in a staff member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalLoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/auth/logout:
    post:
      operationId: portalLogout
      tags:
        - supportPortal
      security:
        - portalSession: []
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedOutState"
  /portal/auth/session:
    get:
      operationId: getPortalSession
      tags:
        - supportPortal
      security:
        - portalSession: []
      responses:
        "200":
          description: Current staff session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/dashboard:
    get:
      operationId: getPortalDashboard
      tags:
        - supportPortal
      security:
        - portalSession: []
      responses:
        "200":
          description: Support queue summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboard"
  /portal/command-center:
    get:
      operationId: getPortalCommandCenter
      tags:
        - supportPortal
      summary: Read the Development-only owner command center
      description: Returns stored isolated-test monitoring summaries. Live bot and channel health remain unknown unless persisted telemetry exists.
      security:
        - portalSession: []
      responses:
        "200":
          description: Read-only monitoring summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalCommandCenter"
        "401":
          description: Sign-in required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Available only in the Development isolated-test environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/channel-history:
    get:
      operationId: getPortalChannelHistory
      tags:
        - supportPortal
      summary: Read a selected Development bot's channel post history
      description: Owner-only history from the main bot's Development schema or the isolated test schema. Production data is not connected.
      security:
        - portalSession: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 25
        - name: destination
          in: query
          required: false
          schema:
            type: string
            enum:
              - all
              - signals
              - analysis
              - education
            default: all
        - name: bot
          in: query
          required: false
          schema:
            type: string
            enum:
              - main
              - test
            default: main
      responses:
        "200":
          description: Paginated stored Development history for the selected bot; production is not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalChannelHistory"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Available only in the Development isolated-test environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/trades:
    get:
      operationId: listPortalTrades
      tags:
        - supportPortal
      summary: List trade-management records for the current environment
      description: Development is restricted to the isolated test schema; the published application uses only the production schema.
      security:
        - portalSession: []
      responses:
        "200":
          description: Current environment trade list and worker availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTradeManagement"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trade management is unavailable in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/signals:
    get:
      operationId: getPortalSignalControl
      tags:
        - supportPortal
      summary: Read isolated Development signal-control status and setup drafts
      security:
        - portalSession: []
      responses:
        "200":
          description: Isolated setup, worker status, and recent action history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignalPanel"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Available only in isolated Development
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/signals/actions:
    post:
      operationId: createPortalSignalAction
      tags:
        - supportPortal
      summary: Prepare a Development-only zone or signal action
      description: Commands are audited and idempotent. Publishing requires a separate owner confirmation.
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalSignalActionInput"
      responses:
        "200":
          description: Existing action returned for a duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignalAction"
        "201":
          description: Action queued; no Telegram message was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignalAction"
        "400":
          description: Invalid action input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The isolated test bot or its migration is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/signal-actions/{commandId}:
    get:
      operationId: getPortalSignalAction
      tags:
        - supportPortal
      summary: Read a prepared signal action
      security:
        - portalSession: []
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Action status and clean channel preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignalAction"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/signal-actions/{commandId}/confirm:
    post:
      operationId: confirmPortalSignalAction
      tags:
        - supportPortal
      summary: Explicitly approve a reviewed signal action
      security:
        - portalSession: []
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Action approved once; the isolated test bot revalidates it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignalAction"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Publishing is locked or the action has changed state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/signal-actions/{commandId}/cancel:
    post:
      operationId: cancelPortalSignalAction
      tags:
        - supportPortal
      summary: Cancel an unsent signal action
      security:
        - portalSession: []
      parameters:
        - name: commandId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Unsent action cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSignalAction"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Action not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/trades/{tradeId}:
    get:
      operationId: getPortalTrade
      tags:
        - supportPortal
      summary: Read one trade and its saved history
      security:
        - portalSession: []
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Trade detail with message identifiers withheld
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalTradeDetail"
        "403":
          description: Owner access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trade not found or unavailable in this environment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/trades/{tradeId}/actions:
    post:
      operationId: createPortalTradeAction
      tags:
        - supportPortal
      summary: Create a review draft for a trade action
      security:
        - portalSession: []
      parameters:
        - name: tradeId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalTradeActionInput"
      responses:
        "200":
          description: Existing draft returned for a duplicate request
          content:

      operationId: listStaffTeams
      tags:
        - supportPortal
      security:
        - portalSession: []
      responses:
        "200":
          description: Teams available to the current staff member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTeamList"
    post:
      operationId: createStaffTeam
      tags:
        - supportPortal
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTeamInput"
      responses:
        "201":
          description: Team created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTeam"
  /portal/teams/{teamId}/members:
    put:
      operationId: setStaffTeamMembers
      tags:
        - supportPortal
      security:
        - portalSession: []
      parameters:
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffTeamMembersInput"
      responses:
        "200":
          description: Team membership replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffTeam"
  /portal/auth/password:
    post:
      operationId: changePortalPassword
      tags:
        - supportPortal
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PortalPasswordInput"
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSession"
        "400":
          description: Password does not meet requirements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/education-videos:
    get:
      operationId: listEducationVideos
      tags:
        - supportPortal
      security:
        - portalSession: []
      responses:
        "200":
          description: Owner-only video drafts and configured destination status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationVideoList"
    post:
      operationId: createEducationVideoDraft
      tags:
        - supportPortal
      security:
        - portalSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationVideoDraftInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationVideo"
  /portal/education-videos/{videoId}/file:
    put:
      operationId: uploadEducationVideoFile
      tags:
        - supportPortal
      security:
        - portalSession: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 80
      requestBody:
        required: true
        content:
          video/mp4:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Video file stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationVideo"
        "413":
          description: Video exceeds the supported upload size
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /portal/education-videos/{videoId}/publish:
    post:
      operationId: publishEducationVideo
      tags:
        - supportPortal
      security:
        - portalSession: []
      parameters:
        - name: videoId
          in: path
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 80
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EducationVideoPublishInput"
      responses:
        "202":
          description: Publication request queued for the configured video-only destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EducationVideo"
        "409":
          description: Draft is not ready or publication is already in progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "423":
          description: Publishing is locked or the video destination is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/user:
    get:
      tags:
        - Auth
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
      responses:
        "200":
          description: Authentication state resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUserEnvelope"
  /login:
    get:
      tags:
        - Auth
      operationId: beginBrowserLogin
      summary: Start browser sign-in
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags:
        - Auth
      operationId: handleBrowserLoginCallback
      summary: Complete browser sign-in
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        "302":
          description: Redirect to the validated return path.
  /logout:
    get:
      tags:
        - Auth
      operationId: logoutBrowserSession
      summary: Clear browser session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
        - $ref: "#/components/parameters/SessionCookie"
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        "302":
          description: Redirect to the sign-out endpoint.
  /mobile-auth/token-exchange:
    post:
      tags:
        - Auth
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MobileTokenExchangeRequest"
      responses:
        "200":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileTokenExchangeSuccess"
        "400":
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Invalid token claims.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /mobile-auth/logout:
    post:
      tags:
        - Auth
      operationId: logoutMobileSession
      summary: Delete a mobile session
      parameters:
        - $ref: "#/components/parameters/AuthorizationSessionHeader"
      responses:
        "200":
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutSuccess"
components:
  securitySchemes:
    botBearer:
      type: http
      scheme: bearer
    portalSession:
      type: apiKey
      in: cookie
      name: smh_portal_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    WhatsAppHealth:
      type: object
      properties:
        status:
          type: string
          enum:
            - ok
      required:
        - status
    AuthStatus:
      type: object
      properties:
        authenticated:
          type: boolean
        passwordConfigured:
          type: boolean
      required:
        - authenticated
        - passwordConfigured
    AdminLogin:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - password
    WhatsAppDashboard:
      type: object
      properties:
        paused:
          type: boolean
        testMode:
          type: boolean
        conversationsToday:
          type: integer
        messagesToday:
          type: integer
        openEnquiries:
          type: integer
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppActivity"
        connection:
          $ref: "#/components/schemas/ConnectionStatus"
      required:
        - paused
        - testMode
        - conversationsToday
        - messagesToday
        - openEnquiries
        - recentActivity
        - connection
    ConnectionStatus:
      type: object
      properties:
        credentialsConfigured:
          type: boolean
        webhookConfigured:
          type: boolean
        geminiConfigured:
          type: boolean
        allowedTestRecipients:
          type: integer
      required:
        - credentialsConfigured
        - webhookConfigured
        - geminiConfigured
        - allowedTestRecipients
    WhatsAppActivity:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
        summary:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - kind
        - summary
        - createdAt
    WhatsAppConversation:
      type: object
      properties:
        id:
          type: integer
        waId:
          type: string
        displayName:
          type:
            - string
            - "null"
        lastMessagePreview:
          type: string
        lastMessageAt:
          type:
            - string
            - "null"
          format: date-time
        unreadCount:
          type: integer
        isEnquiry:
          type: boolean
        testRecipientAllowed:
          type: boolean
        replyWindowOpen:
          type: boolean
      required:
        - id
        - waId
        - displayName
        - lastMessagePreview
        - lastMessageAt
        - unreadCount
        - isEnquiry
        - testRecipientAllowed
        - replyWindowOpen
    WhatsAppConversationDetail:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/WhatsAppConversation"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/WhatsAppMessage"
      required:
        - conversation
        - messages
    WhatsAppMessage:
      type: object
      properties:
        id:
          type: integer
        direction:
          type: string
          enum:
            - inbound
            - outbound
        text:
          type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - direction
        - text
        - status
        - createdAt
    AdminReply:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 4096
      required:
        - text
    EducationModule:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        content:
          type: string
        published:
          type: boolean
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
      required:
        - slug
        - title
        - summary
        - content
        - published
        - updatedAt
    EducationModuleUpdate:
      type: object
      properties:
        summary:
          type: string
          maxLength: 2000
        content:
          type: string
          maxLength: 50000
        published:
          type: boolean
      required:
        - summary
        - content
        - published
    WhatsAppSettings:
      type: object
      properties:
        paused:
          type: boolean
        testMode:
          type: boolean
        telegramCommunityUrl:
          type:
            - string
            - "null"
          format: uri
        webhookUrl:
          type: string
        connection:
          $ref: "#/components/schemas/ConnectionStatus"
      required:
        - paused
        - testMode
        - telegramCommunityUrl
        - webhookUrl
        - connection
    WhatsAppSettingsUpdate:
      type: object
      properties:
        paused:
          type: boolean
        telegramCommunityUrl:
          type:
            - string
            - "null"
          format: uri
    SupportSession:
      type: object
      properties:
        authenticated:
          type: boolean
        needsSetup:
          type: boolean
        staff:
          anyOf:
            - $ref: "#/components/schemas/SupportStaff"
            - type: "null"
      required:
        - authenticated
        - needsSetup
        - staff
    SupportLogin:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - email
        - password
    SupportBootstrap:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 12
          maxLength: 256
      required:
        - email
        - displayName
        - password
    SupportStaff:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
            - owner
            - manager
            - agent
      required:
        - id
        - displayName
        - role
    SupportCaseSummary:
      type: object
      properties:
        caseId:
          type: string
        sourceBot:
          type: string
          enum:
            - signals
            - coach
        memberId:
          type: string
        question:
          type: string
        status:
          type: string
        workflowStatus:
          type: string
        category:
          type: string
        priority:
          type: string
        assignedStaffId:
          type:
            - string
            - "null"
        created:
          type: string
        updated:
          type: string
      required:
        - caseId
        - sourceBot
        - memberId
        - question
        - status
        - workflowStatus
        - category
        - priority
        - assignedStaffId
        - created
        - updated
    SupportCaseList:
      type: object
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/SupportCaseSummary"
      required:
        - cases
    SupportMessage:
      type: object
      properties:
        id:
          type: string
        sender:
          type: string
          enum:
            - member
            - staff
        displayName:
          type: string
        text:
          type: string
        status:
          type: string
        created:
          type: string
      required:
        - id
        - sender
        - displayName
        - text
        - status
        - created
    SupportNote:
      type: object
      properties:
        id:
          type: string
        staffName:
          type: string
        text:
          type: string
        created:
          type: string
      required:
        - id
        - staffName
        - text
        - created
    SupportCaseEvent:
      type: object
      properties:
        id:
          type: string
        actorName:
          type: string
        eventType:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        created:
          type: string
      required:
        - id
        - actorName
        - eventType
        - oldValue
        - newValue
        - created
    SupportCaseDetail:
      type: object
      properties:
        case:
          $ref: "#/components/schemas/SupportCaseSummary"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/SupportMessage"
        notes:
          type: array
          items:
            $ref: "#/components/schemas/SupportNote"
        events:
          type: array
          items:
            $ref: "#/components/schemas/SupportCaseEvent"
      required:
        - case
        - messages
        - notes
        - events
    SupportReplyInput:
      type: object
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 3000
        requestId:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - text
        - requestId
    SupportAssignmentInput:
      type: object
      properties:
        assignedStaffId:
          type:
            - string
            - "null"
      required:
        - assignedStaffId
    SupportStatusInput:
      type: object
      properties:
        workflowStatus:
          type: string
          enum:
            - new
            - assigned
            - in_progress
            - waiting_for_member
            - resolved
            - closed
      required:
        - workflowStatus
    SupportNoteInput:
      type: object
      properties:
        text:
          type: string
          minLength: 3
          maxLength: 3000
      required:
        - text
    BotCreateCaseInput:
      type: object
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        telegramUserId:
          type: integer
          minimum: 1
        question:
          type: string
          minLength: 3
          maxLength: 1000
      required:
        - requestId
        - telegramUserId
        - question
    BotCase:
      type: object
      properties:
        caseId:
          type: string
        sourceBot:
          type: string
          enum:
            - signals
            - coach
        telegramUserId:
          type: string
        question:
          type: string
        status:
          type: string
        created:
          type: string
        updated:
          type: string
      required:
        - caseId
        - sourceBot
        - telegramUserId
        - question
        - status
        - created
        - updated
    BotCaseList:
      type: object
      properties:
        cases:
          type: array
          items:
            $ref: "#/components/schemas/BotCase"
      required:
        - cases
    BotCaseDetail:
      type: object
      properties:
        case:
          $ref: "#/components/schemas/BotCase"
        messages:

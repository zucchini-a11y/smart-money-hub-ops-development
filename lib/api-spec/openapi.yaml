        - scope
        - readOnly
        - refreshedAt
        - lastTelegramUpdate
        - alerts
        - overview
        - bots
        - channels
        - recentOperations
        - recentErrors
    PortalChannelHistory:
      type: object
      properties:
        scope:
          type: string
          enum:
            - development_main_bot
            - development_isolated_test
        productionConnected:
          type: boolean
          const: false
        page:
          type: integer
        limit:
          type: integer
        hasMore:
          type: boolean
        items:
          type: array
          items:
            $ref: "#/components/schemas/PortalChannelHistoryItem"
      required:
        - scope
        - productionConnected
        - page
        - limit
        - hasMore
        - items
    PortalChannelHistoryItem:
      type: object
      properties:
        source:
          type: string
          enum:
            - bot
            - telegram_manual
        destination:
          type: string
          enum:
            - PRO Signals
            - Market Analysis
            - Educational Group · Video tutorials
        eventType:
          type: string
        status:
          type: string
        recordedAt:
          type: string
        messageText:
          type: string
        attachmentLabel:
          type: string
      required:
        - source
        - destination
        - eventType
        - status
        - recordedAt
        - messageText
        - attachmentLabel
    PortalTradeManagement:
      type: object
      properties:

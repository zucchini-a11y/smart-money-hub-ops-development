        - targetLabel
        - publishingEnabled
        - notice
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    PortalLoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256

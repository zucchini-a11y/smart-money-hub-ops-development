kind = "web"
previewPath = "/"
title = "Smart Money Hub Portal"
description = "The authenticated Smart Money Hub portal for owners, staff, and members, bringing support, account management, bot monitoring, and learning workflows into one workspace."
version = "1.0.0"
id = "artifacts/smart-money-hub-ops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19849

[services.development]
run = "pnpm --filter @workspace/smart-money-hub-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-money-hub-ops", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-money-hub-ops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19849"
BASE_PATH = "/"

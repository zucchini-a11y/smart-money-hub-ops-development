name: Build isolated Hostinger Development release package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-development-release
  cancel-in-progress: false

jobs:
  build-and-package:
    name: Verify and package Development
    runs-on: ubuntu-latest
    environment: Development
    env:
      NODE_ENV: development
      PORT: "19849"
      BASE_PATH: /
      PORTAL_SUPPORT_SCHEMA: smh_test
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.DEV_VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PROXY_URL: ${{ vars.DEV_VITE_CLERK_PROXY_URL }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Verify Development database target
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from "node:module";
          import { resolve } from "node:path";

          if (!process.env.DATABASE_URL) {
            console.error("Development database target check failed: protected database secret is unavailable.");
            process.exit(1);
          }
          if (process.env.PORTAL_SUPPORT_SCHEMA !== "smh_test") {
            console.error("Development database target check failed: expected schema smh_test.");
            process.exit(1);
          }

          const requireFromDb = createRequire(
            resolve(process.env.GITHUB_WORKSPACE, "lib/db/package.json"),
          );
          const { Pool } = requireFromDb("pg");
          const pool = new Pool({
            connectionString: process.env.DATABASE_URL,
            connectionTimeoutMillis: 10000,
          });
          let databaseMatches = false;
          let schemaExists = false;
          try {
            const result = await pool.query(`
              SELECT
                current_database() = 'heliumdb' AS development_database,
                EXISTS (
                  SELECT 1 FROM information_schema.schemata
                  WHERE schema_name = 'smh_test'
                ) AS development_schema
            `);
            databaseMatches = result.rows[0]?.development_database === true;
            schemaExists = result.rows[0]?.development_schema === true;
          } catch {
            console.error("Development database target check failed; connection details are suppressed.");
            process.exitCode = 1;
          } finally {
            try {
              await pool.end();
            } catch {
              process.exitCode = 1;
            }
          }

          if (process.exitCode) process.exit();
          if (!databaseMatches || !schemaExists) {
            console.error("Development database target check failed: expected heliumdb with schema smh_test.");
            process.exit(1);
          }
          console.log("Development database target verified: smh_test.");
          NODE

      - name: Test API
        run: pnpm --filter @workspace/api-server run test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Require Development Clerk publishable key
        shell: bash
        run: |
          if [[ -z "${VITE_CLERK_PUBLISHABLE_KEY:-}" ]]; then
            echo "::error::Set the GitHub Actions variable DEV_VITE_CLERK_PUBLISHABLE_KEY to the Development Clerk publishable key."
            exit 1
          fi

      - name: Build Development Portal
        run: pnpm --filter @workspace/smart-money-hub-ops exec vite build --config vite.config.ts --mode development

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Create isolated Development release package
        run: |
          bash scripts/package-hostinger-development-release.sh \
            "$RUNNER_TEMP/smh-portal-development-${GITHUB_SHA}.zip"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: smh-portal-development-${{ github.sha }}
          path: ${{ runner.temp }}/smh-portal-development-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 14
